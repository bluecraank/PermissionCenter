[package]
name = "gpo-client"
description = "PermissionCenter-GPO-Client: liest alle Gruppenrichtlinien auf einem Domänencontroller und überträgt sie an den Server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gpo-client"
path = "src/main.rs"

[dependencies]
pc-common.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
clap.workspace = true
flate2.workspace = true
roxmltree = "0.20"
ureq = { version = "3", features = ["json"] }
