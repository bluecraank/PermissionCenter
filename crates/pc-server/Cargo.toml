[package]
name = "pc-server"
description = "PermissionCenter-Server: sammelt, analysiert und visualisiert Berechtigungsdaten"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pc-server"
path = "src/main.rs"

[dependencies]
pc-common.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
toml.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
flate2.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["decompression-gzip", "compression-gzip", "cors", "trace", "limit"] }
rust-embed = "8"
mime_guess = "2"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = "0.14"
futures-util = "0.3"
getrandom = "0.3"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring", "sync"] }
