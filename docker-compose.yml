# PermissionCenter – Server mit PostgreSQL
#   cp .env.example .env   (Passwörter/Token anpassen)
#   docker compose up -d --build
#   Web-Oberfläche: http://<host>:8080

name: permissioncenter

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-permcenter}
      POSTGRES_USER: ${POSTGRES_USER:-permcenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    # Für viele Inserts (COPY) und Analyse-Abfragen abgestimmt
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - effective_cache_size=1536MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: .
    image: permissioncenter/server:0.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PC_DATABASE_URL: postgres://${POSTGRES_USER:-permcenter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-permcenter}
      PC_API_TOKENS: ${PC_API_TOKENS:-}
      PC_LDAP_URL: ${PC_LDAP_URL:-}
      PC_LDAP_BIND_DN: ${PC_LDAP_BIND_DN:-}
      PC_LDAP_BIND_PASSWORD: ${PC_LDAP_BIND_PASSWORD:-}
      PC_LDAP_BASE_DN: ${PC_LDAP_BASE_DN:-}
      PC_LDAP_SYNC_INTERVAL_MINUTES: ${PC_LDAP_SYNC_INTERVAL_MINUTES:-0}
      PC_CLIENT_UPDATE_PUBLIC_KEY: ${PC_CLIENT_UPDATE_PUBLIC_KEY:-}
      PC_PUBLIC_URL: ${PC_PUBLIC_URL:-}
      PC_NOTIFY_MIN_SEVERITY: ${PC_NOTIFY_MIN_SEVERITY:-high}
      PC_NOTIFY_WEEKLY: ${PC_NOTIFY_WEEKLY:-}
      PC_SMTP_HOST: ${PC_SMTP_HOST:-}
      PC_SMTP_PORT: ${PC_SMTP_PORT:-587}
      PC_SMTP_SECURITY: ${PC_SMTP_SECURITY:-starttls}
      PC_SMTP_USER: ${PC_SMTP_USER:-}
      PC_SMTP_PASSWORD: ${PC_SMTP_PASSWORD:-}
      PC_SMTP_FROM: ${PC_SMTP_FROM:-}
      PC_SMTP_TO: ${PC_SMTP_TO:-}
      PC_WEBHOOK_TEAMS: ${PC_WEBHOOK_TEAMS:-}
      PC_WEBHOOK_SLACK: ${PC_WEBHOOK_SLACK:-}
      # Zeitzone für Wochenbericht und Zeitstempel in Nachrichten
      TZ: ${TZ:-Europe/Berlin}
      PC_LOG: ${PC_LOG:-info,tower_http=warn}
    volumes:
      # Client-Releases für OTA-Updates (docker compose exec server pc-server publish-client …)
      - releases:/var/lib/permissioncenter/client-releases
    ports:
      - "${PC_PORT:-8080}:8080"

volumes:
  pgdata:
  releases:
