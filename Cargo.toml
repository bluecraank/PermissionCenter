[workspace]
resolver = "2"
members = ["crates/pc-common", "crates/pc-client", "crates/pc-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["coredisplay <info@coredisplay.de>"]

[workspace.dependencies]
pc-common = { path = "crates/pc-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
toml = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
